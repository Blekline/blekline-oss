# Additional RBAC for nhim-audit --probe (pods/exec).
# Apply after nhim-audit-reader.yaml. Grant only to operators running active bypass tests.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nhim-audit-probe
  labels:
    app.kubernetes.io/name: nhim-audit
    app.kubernetes.io/component: probe
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nhim-audit-probe
  labels:
    app.kubernetes.io/name: nhim-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nhim-audit-probe
subjects:
  - kind: User
    name: nhim-audit
    apiGroup: rbac.authorization.k8s.io
  # Replace with your CI/service account subject, e.g.:
  # - kind: ServiceAccount
  #   name: nhim-audit
  #   namespace: blekline
