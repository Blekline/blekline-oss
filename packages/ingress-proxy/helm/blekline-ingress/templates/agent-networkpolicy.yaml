{{- if .Values.networkPolicy.agentEgressDeny.enabled }}
# Apply to agent workloads (label blekline-agent=true) — deny direct egress except to Blekline sidecar and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blekline-ingress.fullname" . }}-agent-egress
  labels:
    app.kubernetes.io/name: {{ include "blekline-ingress.name" . }}
spec:
  podSelector:
    matchLabels:
      {{ .Values.networkPolicy.agentPodLabel }}: "true"
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Blekline sidecar (in-cluster standalone or localhost injected)
    - to:
        - podSelector:
            matchLabels:
              blekline-sidecar: "true"
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.networkPolicy.agentEgressDeny.allowHttpsEgress }}
    {{- range .Values.networkPolicy.agentEgressDeny.controlPlaneCidrs }}
    # Blekline control plane HTTPS (policy SSE, mask API)
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- end }}
{{- end }}
