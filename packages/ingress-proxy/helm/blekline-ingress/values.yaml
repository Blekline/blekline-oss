replicaCount: 1

image:
  repository: ghcr.io/blekline/sidecar
  tag: "0.2.1-nhim"
  pullPolicy: IfNotPresent
  # Pin by digest: sha256:... (see deploy/k8s/values-enforce-profile.yaml)
  digest: ""

# Startup enforcement — sets BLEKLINE_REQUIRED_IMAGE_DIGEST / BLEKLINE_IMAGE_DIGEST (server.mjs)
imageDigestEnforcement:
  enabled: false

monitoring:
  enabled: false
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Optional — set when pulling from private GHCR (create secret: kubectl create secret docker-registry ghcr-blekline ...)
imagePullSecrets: []

service:
  type: ClusterIP
  port: 8787

# NEVER expose sidecar via public Ingress — ClusterIP + localhost/agent pod only (NHIM)
ingress:
  enabled: false
  className: ""
  hosts:
    - host: ingress.example.blekline.com
      paths:
        - path: /
          pathType: Prefix

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  agentPodLabel: blekline-agent
  namespace: ""
  agentEgressDeny:
    enabled: true
    # HTTPS egress to Blekline control plane — set explicit CIDRs; never 0.0.0.0/0 in prod
    allowHttpsEgress: false
    controlPlaneCidrs: []

trustVault:
  enabled: true
  dataDir: /app/data/vault
  # Create via ExternalSecrets or: kubectl create secret generic blekline-vault-master --from-literal=masterKey=...
  masterKeySecret: ""
  masterKeySecretKey: masterKey
  # Dev-only: set inline master key when masterKeySecret empty (never in prod git)
  masterKey: ""

lineage:
  enabled: true

# Single stage drives sidecar behavior — see deriveSidecarHelmValues in webapp/lib/enforcement-stage.ts
enforcementStage: audit

failureMode: block

env:
  BLEKLINE_INGRESS_TARGET: "https://app.blekline.com"
  BLEKLINE_INGRESS_REGION: "eu-central-1"
  BLEKLINE_EDGE_LOCAL_MASK: "true"
  BLEKLINE_LISTEN_HOST: "0.0.0.0"
  LISTEN_PORT: "8787"
  BLEKLINE_MAX_BODY_BYTES: "1048576"

# Do NOT commit real tokens — use existingSecret or kubectl create secret
secrets:
  existingSecret: ""
  workspaceToken: ""
  workspaceId: ""
  sidecarAuth: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

# External Secrets Operator — sync workspace token + vault master from cloud KMS
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  remoteRefs:
    workspaceToken:
      key: blekline/platform
      property: workspaceToken
    workspaceId:
      key: blekline/platform
      property: workspaceId
    sidecarAuth:
      key: blekline/platform
      property: sidecarAuth
    vaultMasterKey:
      key: blekline/platform
      property: vaultMasterKey
