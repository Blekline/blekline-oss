[project]
name = "blekline-client"
version = "0.2.0"
description = "Python SDK for Blekline ingress control plane"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]

[project.urls]
Repository = "https://github.com/Blekline/blekline-oss"
Documentation = "https://app.blekline.com/docs/sdk/python"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blekline_client"]
