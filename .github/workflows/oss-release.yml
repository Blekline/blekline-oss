name: OSS Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages

      - run: pnpm demo:mcp-smoke

      - run: pnpm demo:cursor-hook-smoke

      - name: Publish npm packages
        run: node scripts/publish-oss-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish Python SDK to PyPI
        id: pypi
        continue-on-error: true
        run: |
          pip install build twine
          python -m build packages/client-python
          twine upload --skip-existing packages/client-python/dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
