name: OSS Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages

      - run: pnpm demo:mcp-smoke

      - name: Publish npm packages
        run: |
          pnpm --filter @blekline/contracts publish --access public --no-git-checks
          pnpm --filter @blekline/client publish --access public --no-git-checks
          pnpm --filter @blekline/mcp-server publish --access public --no-git-checks
          pnpm --filter @blekline/mcp-proxy publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
