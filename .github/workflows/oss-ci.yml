name: OSS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - run: pnpm build:packages

      - run: pnpm verify:integrations

      - run: pnpm demo:mcp-smoke

      - run: pnpm --filter @blekline/mcp-proxy test

      - run: pnpm --filter @blekline/nhim-audit test

      - name: NHIM audit fixture e2e
        run: pnpm test:nhim-audit:e2e

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python SDK tests
        run: |
          python -m pip install --upgrade pip
          pip install -e "./packages/client-python[dev]"
          pytest packages/client-python/tests -q
