name: Sandbox integration

on:
  schedule:
    # Weekly Monday 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  sandbox-smoke:
    name: Blekline + ${{ matrix.provider }} smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [daytona, modal, vercel, cloudflare, e2b]

    steps:
      - name: Skip if provider integration not enabled
        id: enabled
        run: |
          provider="${{ matrix.provider }}"
          enabled=false
          case "$provider" in
            daytona)    [ "${{ vars.SANDBOX_INTEGRATION_DAYTONA_ENABLED }}" = "true" ] && enabled=true ;;
            modal)      [ "${{ vars.SANDBOX_INTEGRATION_MODAL_ENABLED }}" = "true" ] && enabled=true ;;
            vercel)     [ "${{ vars.SANDBOX_INTEGRATION_VERCEL_ENABLED }}" = "true" ] && enabled=true ;;
            cloudflare) [ "${{ vars.SANDBOX_INTEGRATION_CLOUDFLARE_ENABLED }}" = "true" ] && enabled=true ;;
            e2b)        [ "${{ vars.SANDBOX_INTEGRATION_E2B_ENABLED }}" = "true" ] && enabled=true ;;
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "Skipping $provider — set repo variable SANDBOX_INTEGRATION_${provider^^}_ENABLED=true to opt in."
          elif [ -z "${{ secrets.BLEKLINE_WORKSPACE_TOKEN }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $provider — add BLEKLINE_WORKSPACE_TOKEN secret for live mask smoke."
          fi

      - uses: actions/checkout@v4
        if: steps.enabled.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.enabled.outputs.enabled == 'true'
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        if: steps.enabled.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        if: steps.enabled.outputs.enabled == 'true'

      - run: pnpm build:packages
        if: steps.enabled.outputs.enabled == 'true'

      - name: Run sandbox smoke test (${{ matrix.provider }})
        if: steps.enabled.outputs.enabled == 'true'
        env:
          SANDBOX_PROVIDER: ${{ matrix.provider }}
          BLEKLINE_WORKSPACE_TOKEN: ${{ secrets.BLEKLINE_WORKSPACE_TOKEN }}
          BLEKLINE_API_URL: https://app.blekline.com
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: pnpm demo:sandbox-smoke
