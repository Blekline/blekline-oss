name: Design partner inquiry
description: Platform eval — NHIM audit + Track 01/02/03 deploy
labels: ["design-partner"]
body:
  - type: input
    id: company
    attributes:
      label: Company / product
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - Pre-seed / seed
        - Series A+
        - Enterprise pilot
        - Open source project
    validations:
      required: true

  - type: dropdown
    id: track
    attributes:
      label: Preferred eval track
      options:
        - Track 01 — MCP (Cursor / Claude / Codex)
        - Track 02 — Docker sidecar (staging)
        - Track 03 — Kubernetes fleet
        - Not sure yet
    validations:
      required: true

  - type: checkboxes
    id: clients
    attributes:
      label: Agent clients in use
      options:
        - label: Cursor
        - label: Claude Desktop
        - label: Codex
        - label: Continue
        - label: GitHub Copilot
        - label: OpenHands
        - label: Sourcegraph Cody
        - label: Custom agent (LangChain/LlamaIndex/PydanticAI)
        - label: Azure OpenAI / AWS Bedrock / Vertex
        - label: OpenRouter / Together / Fireworks
        - label: LangSmith / Guardrails
        - label: Daytona
        - label: Modal
        - label: Vercel Sandbox
        - label: Cloudflare
        - label: E2B
        - label: Other sandbox

  - type: textarea
    id: usecase
    attributes:
      label: What do you need from platform eval?
      placeholder: e.g. NHIM audit on staging, mandatory-hop verification, MCP mask/enforce, compliance export
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Best contact (email or LinkedIn)
    validations:
      required: true
