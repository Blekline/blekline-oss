name: Feature request
description: Suggest an improvement to Blekline OSS ingress or MCP tooling
title: "🚀 Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share ideas for Blekline's open-source ingress layer (MCP server, proxy, SDK, Helm sidecar).

        Docs: [Eval journey](https://app.blekline.com/docs/get-started/eval-journey) · [AI Enablement Stack](https://app.blekline.com/docs/introduction/ai-enablement-stack)

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: |
        e.g. I'm always blocked when I need to enforce tool policy on a custom MCP server that isn't Daytona — I have to wire everything manually.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: |
        e.g. Documented pattern for `@blekline/mcp-proxy` with a generic downstream MCP and env var examples for Cursor.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: |
        e.g. Using only REST enforce API from a LangChain node instead of MCP proxy.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
      placeholder: |
        e.g. Enterprise rollout with Cursor; prefer Apache-licensed client changes over AGPL proxy.
